name: 3-Tier Application - Development CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  ACR_LOGIN_SERVER: 3tierappacr.azurecr.io
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true   # suppresses Node.js 20 deprecation warning

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Push Docker Images to ACR
  # ─────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: 3tierappacr.azurecr.io        # hardcoded — not sensitive
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            3tierappacr.azurecr.io/3tier-backend:${{ github.sha }}
            3tierappacr.azurecr.io/3tier-backend:dev-latest

      - name: Build & Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            3tierappacr.azurecr.io/3tier-frontend:${{ github.sha }}
            3tierappacr.azurecr.io/3tier-frontend:dev-latest