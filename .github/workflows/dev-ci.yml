name: 3-Tier Application - Development CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

env:
  ACR_LOGIN_SERVER: 3tierappacr0.azurecr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/3tier-backend:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/3tier-backend:dev-latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/3tier-frontend:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/3tier-frontend:dev-latest
