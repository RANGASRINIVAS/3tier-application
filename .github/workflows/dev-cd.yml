name: 3-Tier Application - Development CD

on:
  workflow_run:
    workflows:
      - "3-Tier Application - Development CI"
    types:
      - completed
    branches:
      - develop

env:
  ACR_LOGIN_SERVER: 3tierappacr0.azurecr.io
  AKS_CLUSTER_NAME: 3TIER-APP-AKS
  AKS_RESOURCE_GROUP: RG-TEST
  NAMESPACE: 3tier-application

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Development Application to AKS
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ---------------------------------------------------------
      # 1. Checkout the exact commit built by CI
      # ---------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ---------------------------------------------------------
      # 2. Login to Azure using OIDC
      # ---------------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------------------------------------
      # 3. Install kubectl and kubelogin
      # ---------------------------------------------------------
      - name: Install Azure CLI Kubernetes tools
        run: |
          az aks install-cli

      # ---------------------------------------------------------
      # 4. Verify kubectl and kubelogin
      # ---------------------------------------------------------
      - name: Verify Kubernetes tools
        run: |
          kubectl version --client
          kubelogin --version

      # ---------------------------------------------------------
      # 5. Get AKS credentials
      # ---------------------------------------------------------
      - name: Get AKS credentials
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      # ---------------------------------------------------------
      # 6. Configure kubelogin
      # ---------------------------------------------------------
      - name: Configure kubelogin
        run: |
          kubelogin convert-kubeconfig -l azurecli

      # ---------------------------------------------------------
      # 7. Verify Azure authentication
      # ---------------------------------------------------------
      - name: Verify Azure account
        run: |
          az account show

      # ---------------------------------------------------------
      # 8. Verify AKS connectivity
      # ---------------------------------------------------------
      - name: Verify AKS connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ---------------------------------------------------------
      # 9. Create namespace
      # ---------------------------------------------------------
      - name: Create namespace
        run: |
          kubectl create namespace "${{ env.NAMESPACE }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ---------------------------------------------------------
      # 10. Deploy ConfigMap
      # ---------------------------------------------------------
      - name: Deploy ConfigMap
        run: |
          kubectl apply \
            -f k8s/configmap.yaml \
            -n "${{ env.NAMESPACE }}"

      # ---------------------------------------------------------
      # 11. Create / Update Kubernetes Secret
      # ---------------------------------------------------------
      - name: Create Kubernetes Secret
        run: |
          kubectl create secret generic 3tier-application-secret \
            --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=DB_HOST="${{ secrets.DB_HOST }}" \
            --from-literal=DB_PORT="${{ secrets.DB_PORT }}" \
            --from-literal=DB_NAME="${{ secrets.DB_NAME }}" \
            --from-literal=DB_USER="${{ secrets.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=BACKEND_PORT="${{ secrets.BACKEND_PORT }}" \
            --from-literal=FRONTEND_PORT="${{ secrets.FRONTEND_PORT }}" \
            --namespace="${{ env.NAMESPACE }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ---------------------------------------------------------
      # 12. Deploy Backend
      # ---------------------------------------------------------
      - name: Deploy Backend
        run: |
          kubectl apply \
            -f k8s/backend-deployment.yaml \
            -n "${{ env.NAMESPACE }}"

          kubectl apply \
            -f k8s/backend-service.yaml \
            -n "${{ env.NAMESPACE }}"

      # ---------------------------------------------------------
      # 13. Deploy Frontend
      # ---------------------------------------------------------
      - name: Deploy Frontend
        run: |
          kubectl apply \
            -f k8s/frontend-deployment.yaml \
            -n "${{ env.NAMESPACE }}"

          kubectl apply \
            -f k8s/frontend-service.yaml \
            -n "${{ env.NAMESPACE }}"

      # ---------------------------------------------------------
      # 14. Update Backend Image
      # ---------------------------------------------------------
      - name: Update Backend Image
        run: |
          kubectl set image \
            deployment/3tier-application-backend \
            backend=${{ env.ACR_LOGIN_SERVER }}/3tier-backend:${{ github.event.workflow_run.head_sha }} \
            -n "${{ env.NAMESPACE }}"

      # ---------------------------------------------------------
      # 15. Update Frontend Image
      # ---------------------------------------------------------
      - name: Update Frontend Image
        run: |
          kubectl set image \
            deployment/3tier-application-frontend \
            frontend=${{ env.ACR_LOGIN_SERVER }}/3tier-frontend:${{ github.event.workflow_run.head_sha }} \
            -n "${{ env.NAMESPACE }}"

      # ---------------------------------------------------------
      # 16. Verify Backend Deployment
      # ---------------------------------------------------------
      - name: Verify Backend Deployment
        run: |
          kubectl rollout status \
            deployment/3tier-application-backend \
            -n "${{ env.NAMESPACE }}" \
            --timeout=120s

      # ---------------------------------------------------------
      # 17. Verify Frontend Deployment
      # ---------------------------------------------------------
      - name: Verify Frontend Deployment
        run: |
          kubectl rollout status \
            deployment/3tier-application-frontend \
            -n "${{ env.NAMESPACE }}" \
            --timeout=120s

      # ---------------------------------------------------------
      # 18. Check Kubernetes Resources
      # ---------------------------------------------------------
      - name: Check Kubernetes Resources
        run: |
          echo "===== PODS ====="
          kubectl get pods \
            -n "${{ env.NAMESPACE }}" \
            -o wide

          echo "===== DEPLOYMENTS ====="
          kubectl get deployments \
            -n "${{ env.NAMESPACE }}"

          echo "===== SERVICES ====="
          kubectl get services \
            -n "${{ env.NAMESPACE }}"

      # ---------------------------------------------------------
      # 19. Get Frontend Public IP
      # ---------------------------------------------------------
      - name: Get Frontend Public IP
        run: |
          echo "===== FRONTEND SERVICE ====="

          kubectl get service \
            3tier-application-frontend-service \
            -n "${{ env.NAMESPACE }}" \
            -o wide