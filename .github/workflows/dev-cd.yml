```yaml
name: 3-Tier Application - Development CD

on:
  workflow_run:
    workflows: ["3-Tier Application - Development CI"]
    types:
      - completed
    branches:
      - develop

  push:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACR_LOGIN_SERVER: 3tierappacr.azurecr.io
  AKS_CLUSTER_NAME: 3TIER-APP-AKS
  AKS_RESOURCE_GROUP: RG-TEST
  NAMESPACE: 3tier-application

permissions:
  id-token: write
  contents: read

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Deploy to AKS
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ── 1. Checkout ──────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. Azure Login (OIDC) ────────────
      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 3. Connect to AKS ────────────────
      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      # ── 4. Install kubelogin ─────────────
      - name: Install kubelogin
        uses: azure/use-kubelogin@v1

      # ── 5. Configure kubelogin ───────────
      - name: Configure kubelogin
        run: |
          kubelogin convert-kubeconfig -l azurecli

      # ── 6. Verify AKS connectivity ───────
      - name: Verify AKS connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ── 7. Create Namespace ──────────────
      - name: Create namespace
        run: |
          kubectl apply -f k8s/3tier-applicationdev.yml

      # ── 8. Deploy ConfigMap ──────────────
      - name: Deploy ConfigMap
        run: |
          kubectl apply -f k8s/configmap.yaml

      # ── 9. Create Secret ─────────────────
      - name: Create Kubernetes Secret from GitHub Secrets
        run: |
          kubectl create secret generic 3tier-application-secret \
            --from-literal=POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
            --from-literal=POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
            --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=DB_HOST=${{ secrets.DB_HOST }} \
            --from-literal=DB_PORT=${{ secrets.DB_PORT }} \
            --from-literal=DB_NAME=${{ secrets.DB_NAME }} \
            --from-literal=DB_USER=${{ secrets.DB_USER }} \
            --from-literal=DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --from-literal=BACKEND_PORT=${{ secrets.BACKEND_PORT }} \
            --from-literal=FRONTEND_PORT=${{ secrets.FRONTEND_PORT }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ── 10. Deploy Backend ───────────────
      - name: Deploy Backend
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml

      # ── 11. Deploy Frontend ──────────────
      - name: Deploy Frontend
        run: |
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml

      # ── 12. Update Image Tags ────────────
      - name: Update images with latest SHA
        run: |
          kubectl set image deployment/3tier-application-backend \
            backend=${{ env.ACR_LOGIN_SERVER }}/3tier-backend:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

          kubectl set image deployment/3tier-application-frontend \
            frontend=${{ env.ACR_LOGIN_SERVER }}/3tier-frontend:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

      # ── 13. Verify Backend Deployment ─────
      - name: Verify backend deployment
        run: |
          kubectl rollout status deployment/3tier-application-backend \
            -n ${{ env.NAMESPACE }} \
            --timeout=120s

      # ── 14. Verify Frontend Deployment ───
      - name: Verify frontend deployment
        run: |
          kubectl rollout status deployment/3tier-application-frontend \
            -n ${{ env.NAMESPACE }} \
            --timeout=120s

      # ── 15. Get Frontend Public IP ────────
      - name: Get frontend public IP
        run: |
          echo "Waiting for public IP..."
          kubectl get service 3tier-application-frontend-service \
            -n ${{ env.NAMESPACE }} \
            -o wide
```
