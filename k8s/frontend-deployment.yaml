apiVersion: apps/v1
kind: Deployment
metadata:
  name: 3tier-application-frontend
  namespace: 3tier-application
  labels:
    app: 3tier-application
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 3tier-application
      tier: frontend
  template:
    metadata:
      labels:
        app: 3tier-application
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: 3tierappacr.azurecr.io/3tier-frontend:dev-latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: 3tier-application-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5